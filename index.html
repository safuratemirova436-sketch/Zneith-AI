<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(31, 41, 55, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- Header -->
    <header class="relative z-10 glass px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <button id="btn-sidebar" class="text-gray-300 hover:text-white p-1 cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">Z</div>
                <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Zenith AI</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button id="btn-login-google" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium transition cursor-pointer flex items-center space-x-1">
                <span>Войти через Google</span>
            </button>
            <button id="btn-new-chat" class="p-2 rounded-lg glass-card hover:bg-white/10 transition text-gray-300 hover:text-white cursor-pointer" title="Новый чат">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
            <button id="btn-settings" class="p-2 rounded-lg glass-card hover:bg-white/10 transition text-gray-300 hover:text-white cursor-pointer" title="Настройки">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
            <div id="user-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                Jasur
            </div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden cursor-pointer"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-72 glass z-30 transform -translate-x-full transition-transform duration-300 flex flex-col p-4">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-semibold text-gray-200">История чатов</h2>
            <button id="btn-close-sidebar" class="text-gray-400 hover:text-white p-1 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div id="chat-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
    </aside>

    <!-- Main Container -->
    <main class="relative z-10 flex-1 flex flex-col max-w-4xl w-full mx-auto p-4 overflow-hidden">
        <div id="api-key-banner" class="hidden mb-4 p-3 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm flex justify-between items-center">
            <span>⚠️ API ключ не задан. Нажмите на шестерёнку (⚙️), чтобы добавить ключ Gemini.</span>
            <button id="btn-banner-settings" class="underline ml-2 font-medium cursor-pointer">Настроить</button>
        </div>

        <div id="messages-container" class="flex-1 overflow-y-auto space-y-4 pr-2 pb-24"></div>

        <!-- Input Box -->
        <div class="absolute bottom-4 left-4 right-4 max-w-4xl mx-auto">
            <div class="glass p-2 rounded-2xl flex items-center space-x-2 shadow-2xl">
                <textarea id="chat-input" rows="1" placeholder="Задайте вопрос Zenith AI..." class="flex-1 bg-transparent border-0 text-white placeholder-gray-400 focus:outline-none focus:ring-0 px-3 py-2 resize-none max-h-32"></textarea>
                <button id="btn-send" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
            </div>
            <div class="text-center text-xs text-gray-500 mt-2">Zenith AI автоматически распознаёт язык вашего сообщения.</div>
        </div>
    </main>

    <!-- Modal Settings -->
    <div id="modal-settings" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass max-w-md w-full p-6 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-semibold text-white">Настройки Zenith AI</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-white cursor-pointer">✕</button>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Gemini API Key</label>
                <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                <p class="text-xs text-gray-400 mt-1">Ключ можно скопировать в <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text
